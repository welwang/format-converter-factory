name: 功能建議
description: 想新增或改善的功能
title: "[建議] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 你遇到什麼情況？現在怎麼處理？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的結果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他想法
  - type: checkboxes
    id: offline
    attributes:
      label: 確認
      options:
        - label: 這個功能可以完全在本機完成，不需要雲端服務或帳號
